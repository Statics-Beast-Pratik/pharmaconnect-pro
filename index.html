<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaConnect | Enterprise Command Center</title>
    <style>
        :root { --bg: #050505; --panel: #111111; --blue: #3b82f6; --text: #f8fafc; --green: #10b981; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        .gate { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { width: 350px; padding: 40px; background: var(--panel); border: 1px solid #333; border-radius: 16px; text-align: center; }
        input { width: 100%; padding: 14px; margin: 20px 0; background: #000; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: var(--blue); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #app { display: none; padding: 30px; }
        .pipeline-node { background: #1a1a1a; padding: 20px; margin: 20px 0; border-left: 5px solid var(--blue); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .status-pill { padding: 5px 12px; border-radius: 20px; font-size: 12px; background: #222; }
    </style>
</head>
<body>

    <div class="gate" id="gate">
        <div class="auth-card">
            <h2>System Authentication</h2>
            <p>Access Token Required</p>
            <input type="text" id="token" placeholder="Enter Token (MR/MGR)">
            <button onclick="verify()">ACCESS TERMINAL</button>
        </div>
    </div>

    <div id="app">
        <h1 id="role-head"></h1>
        <div id="pipeline-stream"></div>
        <button onclick="location.reload()" style="background:transparent; border:1px solid #555; margin-top:30px;">SECURE LOGOUT</button>
    </div>

    <script>
        const database = {
            "MR": { 
                role: "Field Operations Unit", 
                pipeline: [
                    { task: "Check-in Location", status: "Pending" },
                    { task: "Doctor Visit Log", status: "Locked" },
                    { task: "POB Dispatch", status: "Locked" }
                ] 
            },
            "MGR": { 
                role: "Regional Command Admin", 
                pipeline: [
                    { task: "Review Ledger", status: "Active" },
                    { task: "Compliance Audit", status: "Active" },
                    { task: "Approve Pipeline", status: "Active" }
                ] 
            }
        };

        function verify() {
            const token = document.getElementById('token').value.toUpperCase();
            const role = token.includes("MR") ? "MR" : (token.includes("MGR") ? "MGR" : null);

            if(role) {
                document.getElementById('gate').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                document.getElementById('role-head').innerText = database[role].role;
                
                let stream = database[role].pipeline.map(p => `
                    <div class="pipeline-node">
                        <div>
                            <h3>${p.task}</h3>
                            <span class="status-pill">${p.status}</span>
                        </div>
                        <button onclick="execute('${p.task}')" style="width:auto; padding:8px 16px;">EXECUTE</button>
                    </div>
                `).join('');
                document.getElementById('pipeline-stream').innerHTML = stream;
            } else { alert("ACCESS DENIED: Illegal Token Detected"); }
        }

        function execute(task) {
            alert("Security Protocol: Data Logged for " + task + ". Token Encrypted.");
        }
    </script>
</body>
</html>
