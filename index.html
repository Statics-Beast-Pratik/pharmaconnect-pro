<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PharmaConnect Pro</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // Ye raha tera unique config
        const firebaseConfig = {
            apiKey: "AIzaSyC51Lcc5QyXNSrv56Hb0Y7c-JhYWpy6ovk",
            authDomain: "pharmaconnect-pro.firebaseapp.com",
            projectId: "pharmaconnect-pro",
            storageBucket: "pharmaconnect-pro.appspot.com",
            messagingSenderId: "556049193150",
            appId: "1:556049193150:web:58daa8b31ace3299e7a6ef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Data sync function
        window.submitData = function(task, data) {
            push(ref(db, 'reports/'), {
                task: task,
                info: data,
                timestamp: new Date().toLocaleString()
            });
            alert("Data synced to Cloud!");
        };
    </script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 10px; }
        button { width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; background: #3b82f6; }
    </style>
</head>
<body>
    <div id="app-screen">
        <div class="card">
            <h2>SFA Dashboard</h2>
            <div id="tasks-area">
                <button onclick="capture('Check-in')">Check-in</button>
                <button onclick="capture('POB Entry')">POB Entry</button>
            </div>
        </div>
    </div>
    <script>
        function capture(task) {
            let data = prompt("Enter " + task + " Details:");
            if (data) {
                submitData(task, data);
            }
        }
    </script>
</body>
</html>
