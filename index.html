<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFA Core App</title>
    <link rel="stylesheet" href="style.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC51Lcc5QyXNSrv56Hb0Y7c-JhYWpy6ovk",
            authDomain: "pharmaconnect-pro.firebaseapp.com",
            projectId: "pharmaconnect-pro",
            databaseURL: "https://pharmaconnect-pro-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "pharmaconnect-pro.appspot.com",
            messagingSenderId: "556049193150",
            appId: "1:556049193150:web:58daa8b31ace3299e7a6ef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.submitEntry = function(task) {
            const data = prompt("Enter " + task + " details:");
            if (data && data.trim() !== "") {
                push(ref(db, 'reports/'), {
                    task: task,
                    details: data,
                    timestamp: new Date().toISOString()
                }).then(() => {
                    document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed; bottom:20px; right:20px; background:#22c55e; color:white; padding:15px; border-radius:8px; font-family:sans-serif; z-index:9999; box-shadow:0 4px 6px rgba(0,0,0,0.1);">Entry Synced Successfully!</div>');
setTimeout(() => document.body.lastElementChild.remove(), 3000);
                    
                }).catch((error) => {
                    alert("Error: Data not synced. Check connection.");
                });
            } else {
                alert("Entry cancelled or empty.");
            }
        };
    </script>
    <style>
        body { font-family: sans-serif; background: #f8fafc; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: #0f172a; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>SFA Core</h2>
        <button onclick="submitEntry('Check-in')">Check-in</button>
        <button onclick="submitEntry('POB Entry')">POB Entry</button>
        <button onclick="submitEntry('Retailer Visit')">Retailer Visit</button>
    </div>
</body>
</html>
